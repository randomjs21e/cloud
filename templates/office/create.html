{% extends 'base.html' %}
{% block title %}Yeni sənəd - Cloud{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
    <div class="w-full max-w-md">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold">Yeni sənəd</h1>
            <a href="{% url 'office:index' %}" class="text-sm text-brand-600 hover:underline">← Ofis</a>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 p-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Sənəd adı</label>
                    <input type="text" name="title" placeholder="Sənəd adı" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Növ</label>
                    <div class="grid grid-cols-3 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="doc" checked class="hidden peer">
                            <div class="text-center p-4 rounded-xl border border-gray-200 peer-checked:border-brand-600 peer-checked:bg-brand-50 hover:bg-gray-50">
                                <div class="text-2xl mb-1">📄</div>
                                <div class="text-xs font-medium">Sənəd</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="sheet" class="hidden peer">
                            <div class="text-center p-4 rounded-xl border border-gray-200 peer-checked:border-brand-600 peer-checked:bg-brand-50 hover:bg-gray-50">
                                <div class="text-2xl mb-1">📊</div>
                                <div class="text-xs font-medium">Cədvəl</div>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="type" value="slides" class="hidden peer">
                            <div class="text-center p-4 rounded-xl border border-gray-200 peer-checked:border-brand-600 peer-checked:bg-brand-50 hover:bg-gray-50">
                                <div class="text-2xl mb-1">📽️</div>
                                <div class="text-xs font-medium">Slayd</div>
                            </div>
                        </label>
                    </div>
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">Yarat</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
