{% extends 'base.html' %}
{% block title %}Redaktə - {{ contact.name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex">
    {% include 'partials/sidebar.html' %}

    <main class="flex-1 p-6 max-w-2xl">
        <a href="{% url 'contacts:index' %}" class="text-sm text-brand-600 hover:underline">← Kontaktlar</a>
        <h1 class="text-2xl font-bold mt-1 mb-6">Kontaktı redaktə et</h1>
        <form method="post" class="bg-white rounded-2xl border border-gray-100 p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ad *</label>
                <input type="text" name="name" value="{{ contact.name }}" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Telefon</label>
                <input type="text" name="phone" value="{{ contact.phone }}" placeholder="+994..." class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">E-poçt</label>
                <input type="email" name="email" value="{{ contact.email }}" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Şirkət</label>
                <input type="text" name="company" value="{{ contact.company }}" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ünvan</label>
                <input type="text" name="address" value="{{ contact.address }}" placeholder="Şəhər, küçə..." class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Qeyd</label>
                <textarea name="notes" rows="3" class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">{{ contact.notes }}</textarea>
            </div>
            <div class="flex gap-3">
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">💾 Yadda saxla</button>
                <a href="{% url 'contacts:index' %}" class="px-5 py-2.5 rounded-lg bg-white border border-gray-200 hover:bg-gray-50 font-medium">Ləğv et</a>
            </div>
        </form>
    </main>
</div>
{% endblock %}
