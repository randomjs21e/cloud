{% load static %}
<aside class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0">
    <div class="p-4 flex items-center gap-3 border-b border-gray-100">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-lg">C</div>
        <div>
            <div class="font-bold text-gray-900 leading-tight">Cloud</div>
            <div class="text-xs text-gray-500">{{ user.get_full_name|default:user.username }}</div>
        </div>
    </div>
    <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
        {% for item in sidebar_items %}
        <a href="{{ item.url }}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm {% if item.key == active_app %}text-brand-700 bg-brand-50 font-medium{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
            <span class="w-5 text-center">{{ item.icon }}</span> {{ item.label }}
        </a>
        {% endfor %}
    </nav>
    <div class="p-3 border-t border-gray-100">
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full text-left px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100">⏻ Çıxış</button>
        </form>
    </div>
</aside>
