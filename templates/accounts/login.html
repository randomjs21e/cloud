{% extends 'base.html' %}
{% block title %}Daxil ol - Cloud{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50 p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-700 flex items-center justify-center text-white font-bold text-2xl mx-auto mb-3">C</div>
            <h1 class="text-2xl font-bold">Daxil ol</h1>
            <p class="text-gray-500 text-sm">Hesabınıza davam edin</p>
        </div>
        <div class="bg-white rounded-2xl border border-gray-100 p-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {% if form.non_field_errors %}
                <div class="px-4 py-3 rounded-lg bg-red-50 text-red-600 text-sm">{{ form.non_field_errors.0 }}</div>
                {% endif %}
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">İstifadəçi adı və ya email</label>
                    <input type="text" name="username" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Şifrə</label>
                    <input type="password" name="password" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium">Daxil ol</button>
            </form>
        </div>
        <p class="text-center text-sm text-gray-500 mt-4">
            Hesabınız yoxdur? <a href="{% url 'accounts:register' %}" class="text-brand-600 hover:underline">Qeydiyyatdan keçin</a>
        </p>
    </div>
</div>
{% endblock %}
