{% extends 'base.html' %}
{% block title %}Yeni mövzu - {{ category.name }}{% endblock %}
{% block content %}
<div class="min-h-screen flex">
    {% include 'partials/sidebar.html' %}

    <main class="flex-1 p-6 max-w-3xl">
        <a href="{% url 'forum:category' category.id %}" class="text-sm text-brand-600 hover:underline">← {{ category.name }}</a>
        <h1 class="text-2xl font-bold mt-1 mb-6">Yeni mövzu</h1>
        <form method="post" id="thread-form" class="bg-white rounded-2xl border border-gray-100 p-6 space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Başlıq</label>
                <input type="text" name="title" required class="w-full px-4 py-2 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mətn</label>
                <div id="editor" class="min-h-[40vh]"></div>
                <input type="hidden" name="body" id="body-input">
            </div>
            <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Yarat</button>
        </form>
    </main>
</div>
{% endblock %}
{% block extra_js %}
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>
<script>
(function () {
    var toolbarOptions = [
        [{ 'header': [1, 2, 3, false] }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        [{ 'align': [] }],
        ['blockquote', 'code-block'],
        ['link', 'image'],
        ['clean']
    ];
    var quill = new Quill('#editor', {
        theme: 'snow',
        placeholder: 'Mövzunuzu yazın...',
        modules: { toolbar: toolbarOptions }
    });

    function uploadImage(file) {
        var fd = new FormData();
        fd.append('file', file);
        fetch('{% url "forum:upload" %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value },
            body: fd
        }).then(function (r) { return r.json(); }).then(function (data) {
            if (data.url) {
                var range = quill.getSelection(true);
                quill.insertEmbed(range.index, 'image', data.url);
            } else {
                alert(data.error || 'Yükləmə uğursuz oldu.');
            }
        });
    }

    quill.getModule('toolbar').addHandler('image', function () {
        var input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = function () {
            if (input.files && input.files[0]) uploadImage(input.files[0]);
        };
        input.click();
    });

    document.getElementById('thread-form').addEventListener('submit', function () {
        document.getElementById('body-input').value = quill.root.innerHTML;
    });
})();
</script>
{% endblock %}
